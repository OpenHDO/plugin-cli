[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "openhdo-plugin-cli"
version = "1.1.0"
requires-python = ">=3.11"
description = "HDO plugin scaffold, validation, deterministic packaging and deployment"
license = {text = "Apache-2.0"}
[project.scripts]
hdop = "openhdo_cli.__main__:main"
[tool.setuptools.packages.find]
include = ["openhdo_cli*", "openhdo_plugin*"]
